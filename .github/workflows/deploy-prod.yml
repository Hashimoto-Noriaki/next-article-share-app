name: Deploy Production

on:
  release:
    types: [published]

# 本番用の Vercel プロジェクトへ、リリースタグの内容をデプロイする
# アプリの環境変数は Vercel のプロジェクト設定で管理し、vercel pull で取得する
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROD_PROJECT_ID }}
  VERCEL_CLI_VERSION: '63.1.2'

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ !github.event.release.prerelease && !github.event.release.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.19'
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install --global vercel@${{ env.VERCEL_CLI_VERSION }}

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_PROD_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_PROD_TOKEN }}

      # ビルドが通ってからマイグレーションを流す（Neon の Direct URL を使う）
      - name: Install dependencies
        run: npm ci

      - name: Migrate database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PROD_MIGRATE_DATABASE_URL }}

      - name: Deploy to Vercel (Production)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_PROD_TOKEN }}
