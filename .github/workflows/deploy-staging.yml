name: Deploy Staging

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [master]

# ステージング用の Vercel プロジェクトへ、本番扱い（固定ドメイン）でデプロイする
# アプリの環境変数は Vercel のプロジェクト設定で管理し、vercel pull で取得する
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_STG_PROJECT_ID }}
  VERCEL_CLI_VERSION: '63.1.2'

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # master への push で CI が成功したときだけ動かす（PR の CI や失敗時は除外）
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.19'
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install --global vercel@${{ env.VERCEL_CLI_VERSION }}

      # vercel build より前に実行する（後で実行すると prisma generate の生成物が消えてデプロイが失敗する）
      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_STG_TOKEN }}

      # Sensitive の環境変数は vercel pull で値を取れないことがあるため、prisma generate 用に直接渡す
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_STG_TOKEN }}
        env:
          DATABASE_URL: ${{ secrets.STG_MIGRATE_DATABASE_URL }}

      # ビルドが通ってからマイグレーションを流す（Neon の Direct URL を使う）
      - name: Migrate database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.STG_MIGRATE_DATABASE_URL }}

      - name: Deploy to Vercel (Staging)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_STG_TOKEN }}
